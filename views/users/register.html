<div class="col-lg-6 offset-lg-3">
    <h3><i class="bi bi-person-add">&nbsp;Registration</i></h3>
    <hr>

    <div class="form-floating mb-3">
        <input type="text" class="form-control" id="name" placeholder="">
        <label for="name">Username</label>
    </div>
    <div class="form-floating mb-3">
        <input type="email" class="form-control" id="email" placeholder="">
        <label for="email">E-mail address</label>
    </div>
    <div class="form-floating mb-3">
        <input type="password" class="form-control" id="password" placeholder="">
        <label for="password">Password</label>
    </div>
    <div class="form-floating mb-3">
        <input type="password" class="form-control" id="confirm" placeholder="">
        <label for="confirm">Confirm Password</label>
    </div> 

    <button type="button" class="btn btn-primary mb-3" onclick="registration()"><i class="bi bi-person-fill-add">&nbsp;&nbsp;Registration</i></button>
    <br>
    <p><strong>Already have an account? <a href="#" onclick="navigate('users/login')">Login!</a></strong></p>

</div>
