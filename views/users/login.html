<div class="col-lg-6 offset-lg-3">
    <h3><i class="bi bi-person-check">&nbsp;Login</i></h3>
    <hr>

    <div class="form-floating mb-3">
        <input type="email" class="form-control" id="email" placeholder="">
        <label for="email">E-mail address</label>
    </div>
    <div class="form-floating mb-3">
        <input type="password" class="form-control" id="password" placeholder="">
        <label for="password">Password</label>
    </div>
    <button type="button" class="btn btn-primary mb-3" onclick="login()">
        <i class="bi bi-person-check-fill">&nbsp;&nbsp;Login</i>
    </button>
    <br>
    <p><strong>No account? <a href="#" onclick="navigate('users/register')">Sign up!</a></strong></p>

</div>
