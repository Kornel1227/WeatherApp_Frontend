
<h3>Weather Reports</h3>
<hr>

<ul class="nav nav-tabs" id="weatherTab" role="tablist">
    <li class="nav-item" role="presentation">
        <button class="nav-link active" id="weather-table-tab"
            data-bs-toggle="tab"
            data-bs-target="#weather-table-pane"
            type="button" role="tab"
            aria-controls="weather-table-pane"
            aria-selected="true">
            Table view
        </button>
    </li>

    <li class="nav-item" role="presentation">
        <button class="nav-link" id="weather-details-tab"
            data-bs-toggle="tab"
            data-bs-target="#weather-details-pane"
            type="button" role="tab"
            aria-controls="weather-details-pane"
            aria-selected="false">
            Chart
        </button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="weather-calendar-tab"
            data-bs-toggle="tab"
            data-bs-target="#weather-calendar-pane"
            type="button" role="tab"
            aria-controls="weather-calendar-pane"
            aria-selected="false">
            Calendar
        </button>
    </li>
</ul>

<div class="tab-content" id="weatherTabContent">
    <div class="tab-pane fade show active p-3"
        id="weather-table-pane" role="tabpanel"
        aria-labelledby="weather-table-tab" tabindex="0">

        <h4>Available Weather Reports</h4>

        <table class="table table-striped table-hover weather-table">
            <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Date</th>
                    <th scope="col">Location</th>
                    <th scope="col">Weather</th>
                    <th scope="col" class="text-end">Min. °C</th>
                    <th scope="col" class="text-end">Max. °C</th>
                    <th scope="col" class="text-end">Rain %</th>
                    <th scope="col" class="text-end">Wind km/h</th>
                    <th scope="col" class="text-end">UV</th>
                </tr>
            </thead>
            <tbody id="weatherList"></tbody>
        </table>
    </div>

    <div class="tab-pane fade p-3"
        id="weather-details-pane" role="tabpanel"
        aria-labelledby="weather-details-tab" tabindex="0">

        <h4>Temperature Chart</h4>
        <div class="tab-pane" id="chartView">
            <canvas id="myChart"></canvas>
        </div>
    </div>

    <div class="tab-pane fade p-3"
        id="weather-calendar-pane" role="tabpanel"
        aria-labelledby="weather-calendar-tab" tabindex="0">

        <h4>Weather Type Calendar</h4>
        <div class="tab-pane" id="calendarView">
            <div id="calendar"></div>
        </div>
    </div>
</div>
