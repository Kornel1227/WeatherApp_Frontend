<div class="container-fluid">

    <h1 id="weatherFormTitle"><i class="bi bi-cloud-plus"></i> Add a weather report</h1>
    <form id="weatherForm" onsubmit="event.preventDefault(); saveWeather();">
        <input type="hidden" id="weatherId">
        <div class="row g-3">
            <div class="col-md-3">
                <label for="date" class="form-label">Date</label>
                <input type="date" class="form-control" id="date" required>
            </div>
            <div class="col-md-3">
                <label for="location" class="form-label">Location</label>
                <input type="text" class="form-control" id="location" placeholder="e.g. Baja" required>
            </div>
            <div class="col-md-2">
                <label for="temp_min" class="form-label">Min temperature (°C)</label>
                <input type="number" step="0.1" class="form-control" id="temp_min" required>
            </div>
            <div class="col-md-2">
                <label for="temp_max" class="form-label">Max temperature (°C)</label>
                <input type="number" step="0.1" class="form-control" id="temp_max" required>
            </div>
            <div class="col-md-2">
                <label for="weather_type" class="form-label">Weather type</label>
                <input type="text" class="form-control" id="weather_type" placeholder="Sunny, Cloudy..." required>
            </div>
            <div class="col-md-3">
                <label for="precipitation_probability" class="form-label">Precipitation probability (%)</label>
                <input type="number" min="0" max="100" class="form-control" id="precipitation_probability" value="0">
            </div>
            <div class="col-md-3">
                <label for="wind_speed" class="form-label">Wind speed (km/h)</label>
                <input type="number" min="0" step="0.1" class="form-control" id="wind_speed" value="0">
            </div>
            <div class="col-md-3">
                <label for="uv_index" class="form-label">UV index</label>
                <input type="number" min="0" step="0.1" class="form-control" id="uv_index">
            </div>
        </div>
        <div class="mt-3 mb-4">
            <button type="submit" class="btn btn-primary" id="saveWeatherBtn"><i class="bi bi-cloud-upload"></i> Add report</button>
            <button type="button" class="btn btn-secondary" onclick="clearWeatherForm()">Clear form</button>
        </div>
    </form>

    <hr>
    <div class="table-responsive mt-3">
        <table class="table table-striped table-hover align-middle">
            <thead>
                <tr><th>ID</th><th>Date</th><th>Location</th><th>Min.</th><th>Max.</th><th>Weather</th><th>Rain</th><th>Wind</th><th>UV</th><th>Actions</th></tr>
            </thead>
            <tbody id="weatherList"></tbody>
        </table>
    </div>
</div>
